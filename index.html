const names={today:'今天',tasks:'所有任務',calendar:'行事曆',completed:'已完成'};function render(){strip();mini();let es=data.filter(x=>x.type==='event'&&x.date===selected),ts=data.filter(x=>x.type==='task'&&x.date===selected);if(view==='tasks')ts=data.filter(x=>x.type==='task'&&!x.done);if(view==='completed')ts=data.filter(x=>x.type==='task'&&x.done);if(view==='calendar'){let end=parse(selected);end.setDate(end.getDate()+6);es=data.filter(x=>x.type==='event'&&x.date>=selected&&x.date<=iso(end));ts=[]}$$('.nav button,.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#breadcrumbPage').textContent=names[view];$('#eyebrow').textContent=view==='today'?'YOUR DAILY OVERVIEW':view==='calendar'?'YOUR UPCOMING SCHEDULE':view==='completed'?'LOOK HOW FAR YOU’VE COME':'YOUR TASKS, YOUR PACE';$('#pageTitle').textContent=view==='today'?`${selected===todayISO?greeting():dayName(selected)}。`:view==='calendar'?'接下來的安排。':view==='completed'?'每一步都算數。':'一件一件，剛剛好。';$('#pageSubtitle').textContent=view==='today'?`${dateText(selected)}　·　把時間留給真正重要的事`:view==='calendar'?`${dateText(selected)} 起，接下來七天`:view==='completed'?'完成的任務，值得記得':'把想做的事，清楚放在眼前';$('#scheduleTitle').textContent=view==='calendar'?'未來七天行程':view==='tasks'?'任務安排':view==='completed'?'完成的任務':'今日時間軸';$('#todoTitle').textContent=view==='completed'?'完成紀錄':view==='tasks'?'待完成任務':view==='calendar'?'該週任務':'今日待辦';$('#taskLink').textContent=view==='completed'?'查看今天 →':'所有任務 →';$('#scheduleLink').textContent=view==='calendar'?'回到今天 →':'查看行事曆 →';$('#navTaskCount').textContent=data.filter(x=>x.type==='task'&&!x.done).length;summary(ts,es);timeline(es,ts);todos(ts);if(view==='calendar'){let end=new Date(parse(selected));end.setDate(end.getDate()+6);$('#todoList').innerHTML=`<div class="empty-state">這週有 ${data.filter(x=>x.type==='task'&&x.date>=selected&&!x.done&&x.date<=iso(end)).length} 項任務，切換「所有任務」查看。</div>`}}

$('#itemForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),type=f.get('type'),id=e.currentTarget.dataset.edit,x={id:id||`i${Date.now()}`,type,title:f.get('title').trim(),date:f.get('date'),note:f.get('note').trim()};if(type==='task'){x.due=f.get('due')||'';x.done=false}else{x.allDay=$('#allDay').checked;if(!x.allDay){x.start=f.get('start');x.end=f.get('end')}x.category='個人';x.color='green'}if(id){let i=data.findIndex(a=>a.id===id);if(i>=0){x.done=data[i].done;data[i]=x}}else data.push(x);delete e.currentTarget.dataset.edit;save();close();selected=x.date;view='today';render();toast(id?'事項已更新':'已新增事項 ✓')};$('#modalClose').onclick=close;$('#cancelButton').onclick=close;$('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))close()};$$('input[name="type"]').forEach(r=>r.onchange=syncType);$('#allDay').onchange=()=>$('#timeFields').hidden=$('#allDay').checked;$('#addButton').onclick=()=>open('task');$('#fabButton').onclick=()=>open('task');$$('.nav button,.mobile-nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(view==='today')selected=todayISO;render()});$('#scheduleLink').onclick=()=>{view=view==='calendar'?'today':'calendar';render()};$('#taskLink').onclick=()=>{view=view==='completed'?'today':'tasks';render()};$('#prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);mini()};$('#nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);mini()};$('#notifBtn').onclick=()=>{let n=data.filter(x=>x.type==='task'&&!x.done&&x.due&&x.due<=todayISO).length;toast(n?`你有 ${n} 項今天或逾期的任務`:'目前沒有需要提醒的事項')};$('#settingsBtn').onclick=()=>toast('個人偏好設定即將推出');
const overlay=$('#searchOverlay');function searchOpen(){overlay.classList.add('open');$('#searchInput').value='';$('#searchResults').innerHTML='<p>輸入關鍵字，搜尋你的行程與任務</p>';setTimeout(()=>$('#searchInput').focus(),30)}function searchClose(){overlay.classList.remove('open')}$('#searchBtn').onclick=searchOpen;overlay.onclick=e=>{if(e.target===overlay)searchClose()};$('#searchInput').oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q){$('#searchResults').innerHTML='<p>輸入關鍵字，搜尋你的行程與任務</p>';return}let found=data.filter(x=>(x.title+' '+(x.note||'')).toLowerCase().includes(q));$('#searchResults').innerHTML=found.length?found.map(x=>`<div class="search-result"><span>${x.type==='event'?'◷':'✓'}　${esc(x.title)}</span><small>${esc(dateText(x.date))}</small></div>`).join(''):'<p>沒有找到符合的事項</p>'};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchOpen()}if(e.key==='Escape'){searchClose();close()}});render()
})();
